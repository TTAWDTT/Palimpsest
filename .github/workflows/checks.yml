name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src experiments tests tools
      - run: uv run --locked python tools/check_layout.py
      - run: uv run --locked pytest -q
      - run: uv build --wheel
