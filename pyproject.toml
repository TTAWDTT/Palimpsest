[project]
name = "palimpsest"
version = "0.1.0"
description = "Image origin research through propagation and physical recapture"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "Pillow==10.4.0",
    "scipy==1.15.3",
    "opencv-python-headless==4.13.0.92",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.16.10"]

[project.scripts]
palimpsest-render = "palimpsest.simulation.render_cli:main"
palimpsest-pipeline = "palimpsest.simulation.pipeline_cli:main"
palimpsest-capture-kit = "palimpsest.simulation.capture_kit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest", "src/origin_simulation"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["work", "reports", "sources"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F823"]
