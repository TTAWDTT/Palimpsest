[project]
name = "palimpsest"
version = "0.2.0"
description = "Image origin research through propagation and physical recapture"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "Pillow==10.4.0",
    "scipy==1.15.3",
    "opencv-python-headless==4.13.0.92",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.16.10"]
classical = ["scikit-learn==1.7.2"]
neural = ["torch==2.7.1", "torchvision==0.22.1", "timm==1.0.12", "PyYAML==6.0.2", "ftfy==6.3.1", "regex==2024.11.6"]

[project.scripts]
palimpsest-render = "palimpsest.simulation.render_cli:main"
palimpsest-simulate = "palimpsest.simulation.pipeline_cli:main"
palimpsest-capture-kit = "palimpsest.simulation.capture_kit:main"
palimpsest-detect = "palimpsest.pipelines.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["work", "reports", "sources"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F823"]
